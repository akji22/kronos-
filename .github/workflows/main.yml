name: Build Windows x64 VST3 & Standalone Plugin
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build-windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure & Build 64-Bit Windows VST3 & Standalone
        shell: pwsh
        run: |
          $SrcDir = if (Test-Path "CMakeLists.txt") { "." } else { "KonosSampler" }
          cmake -S $SrcDir -B build -G "Visual Studio 17 2022" -A x64 -DKONOS_BUILD_JUCE_PLUGIN=ON -DKONOS_FETCH_JUCE=ON
          cmake --build build --config Release --parallel
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item -Recurse -Force "build/KonosSampler_artefacts/Release/VST3/Konos Sampler.vst3" "dist/Konos Sampler.vst3"
          Copy-Item -Force "build/KonosSampler_artefacts/Release/Standalone/Konos Sampler.exe" "dist/Konos Sampler.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Konos-Sampler-Windows-x64-VST3-Standalone
          path: dist/
